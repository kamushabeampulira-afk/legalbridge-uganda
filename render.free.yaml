# LegalBridge — Free Render Blueprint (demo only)
#
# Create this as a separate Blueprint in Render. It uses only free resources:
#   - free Docker web service (0.1 CPU / 512 MB, sleeps after 15 idle minutes)
#   - free Postgres (1 GB, expires 30 days after creation)
#   - free Key Value (25 MB, no persistence)
#
# There is no persistent disk: uploaded media and ChromaDB data are lost when
# the service sleeps, restarts, or redeploys. Good for judging/demos, not for
# real users. See docs/RENDER.md → "Free demo deployment".

version: '1'

services:
  - type: keyvalue
    name: legalbridge-cache-free
    region: frankfurt
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: legalbridge-api-free
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    # Free services have no preDeployCommand, initialDeployHook, disk or Shell.
    # Run everything at boot. --if-empty prevents re-seeding on every wake.
    dockerCommand: /bin/sh /app/start.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: legalbridgeug.org,api.legalbridgeug.org
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://legalbridgeug.org,https://api.legalbridgeug.org
      - key: CORS_ALLOWED_ORIGINS
        value: https://legalbridgeug.org,https://legalbridge-app-free.onrender.com,http://localhost:8081,http://localhost:19006

      - key: DB_ENGINE
        value: postgresql
      - key: DB_NAME
        fromDatabase:
          name: legalbridge-db-free
          property: database
      - key: DB_USER
        fromDatabase:
          name: legalbridge-db-free
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: legalbridge-db-free
          property: password
      - key: DB_HOST
        fromDatabase:
          name: legalbridge-db-free
          property: host
      - key: DB_PORT
        fromDatabase:
          name: legalbridge-db-free
          property: port

      - key: REDIS_URL
        fromService:
          name: legalbridge-cache-free
          type: keyvalue
          property: connectionString

      # Groq's free OpenAI-compatible endpoint keeps AI costs at zero.
      # Model ID is from the official Groq model list:
      # https://console.groq.com/docs/models
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_EXTRA_MAX_TOKENS
        value: '2000'
      - key: AI_DEMO_MODE
        value: 'False'

      # Speech: Groq for English (about 3 s to transcribe, 7-9 s to speak) and Sunbird
      # only for Luganda (25-40 s per request, but far better Luganda). The Groq voice
      # reuses OPENAI_API_KEY because both use the same base URL. Accept the Orpheus
      # model terms once at https://console.groq.com/playground?model=canopylabs/orpheus-v1-english
      - key: STT_PROVIDER
        value: openai_whisper
      - key: TTS_PROVIDER
        value: openai
      - key: SUNBIRD_VOICE_LANGUAGES
        value: lg
      - key: VOICE_OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: STT_WHISPER_MODEL
        value: whisper-large-v3
      - key: TTS_OPENAI_MODEL
        value: canopylabs/orpheus-v1-english
      - key: TTS_OPENAI_VOICE
        value: hannah
      - key: TTS_OPENAI_FORMAT
        value: wav
      - key: TTS_OPENAI_LANGUAGES
        value: en
      - key: TTS_MAX_CHARS
        value: '1100'
      # Sunbird offers free Luganda speech. Register at https://api.sunbird.ai/register
      - key: SUNBIRD_API_TOKEN
        sync: false
      # Load the legal search model at start-up instead of during the first question.
      - key: WARM_UP_ON_START
        value: 'true'

      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SHORTCODE
        value: '*384*0#'
      - key: AT_ENVIRONMENT
        value: sandbox

      # Local image paths — ephemeral on free services.
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
      - key: CHROMA_COLLECTION_NAME
        value: legalbridge_sources
      - key: MEDIA_ROOT
        value: /app/media
      - key: MAX_UPLOAD_SIZE_MB
        value: '10'

  - type: web
    name: legalbridge-app-free
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: EXPO_PUBLIC_API_URL
        value: https://legalbridge-api-free.onrender.com/api

databases:
  - name: legalbridge-db-free
    region: frankfurt
    plan: free
    databaseName: legalbridge_db
    user: legalbridge_user
    ipAllowList: []
